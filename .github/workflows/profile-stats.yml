name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia às 03:00 (horário de Brasília)
  workflow_dispatch:      # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  summary-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar cards de estatísticas
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          AUTO_PUSH: false
      - name: Aplicar visual neon aos cards
        run: python3 tools/style_profile_stats.py
      - name: Publicar estatísticas atualizadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-summary-card-output assets/stats_activity.svg assets/stats_details.svg
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza estatísticas e painéis neon"
            git push
          fi

  snake:
    runs-on: ubuntu-latest
    needs: summary-cards
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Gerar animação da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#53f2fb
      - name: Aplicar fundo neon à cobrinha
        run: python3 tools/style_profile_stats.py --snake dist/github-snake-dark.svg
      - name: Atualizar painel da cobrinha no perfil
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats_snake.svg
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza cobrinha com visual neon"
            git push
          fi
      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
