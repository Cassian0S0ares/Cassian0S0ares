<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 188" width="1100" height="188" role="img" aria-label="Introdução animada às estatísticas reais do GitHub, cartões de atividades, linguagens, streak e cobra de contribuições."><title>Estatísticas do GitHub</title><desc>Introdução animada às estatísticas reais do GitHub, cartões de atividades, linguagens, streak e cobra de contribuições.</desc>
    <style><![CDATA[
    svg{font-family:Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
    .blink{animation:blink 1.3s steps(2,end) infinite}
    .softblink{animation:softblink 3.6s ease-in-out infinite}
    .rain{animation:rain 3s linear infinite}
    .edge-glow{animation:edge 3.2s ease-in-out infinite}
    .scan{animation:scan 6s linear infinite}
    .load{animation:load 5s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
    .spin{animation:spin 18s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
    @keyframes softblink{0%,100%{opacity:.38}50%{opacity:1}}
    @keyframes rain{from{transform:translate(0,-70px)}to{transform:translate(-35px,480px)}}
    @keyframes scan{from{transform:translateX(-1160px)}to{transform:translateX(1160px)}}
    @keyframes edge{0%,100%{opacity:.16}50%{opacity:.9}}
    @keyframes load{0%,100%{transform:scaleX(.28)}50%{transform:scaleX(1)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    
    ]]></style>
