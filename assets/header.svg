<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Terminal: whoami — Cassiano Soares, Desenvolvedor Full Stack">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .p { fill: #9ece6a; } .c { fill: #c0caf5; } .dim { fill: #565f89; }
    .b { fill: #7aa2f7; } .v { fill: #bb9af7; } .o { fill: #e0af68; }
  </style>

  <!-- relógio invisível que dispara a animação uma única vez -->
  <rect width="0" height="0"><animate id="cycle" attributeName="x" from="0" to="0" dur="12s" begin="0s"/></rect>

  <!-- janela no estilo GNOME Terminal (Linux): cantos superiores arredondados, controles à direita -->
  <path d="M9 1 h982 a8 8 0 0 1 8 8 v290 H1 V9 a8 8 0 0 1 8 -8 z" fill="#1a1b26" stroke="url(#edge)" stroke-width="2"/>
  <path d="M9 2 h982 a7 7 0 0 1 7 7 v31 H2 V9 a7 7 0 0 1 7 -7 z" fill="#24283b"/>
  <line x1="2" y1="40" x2="998" y2="40" stroke="#16161e" stroke-width="1"/>
  <text x="500" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#c0caf5">cr4ni0: ~</text>
  <!-- minimizar, maximizar, fechar -->
  <g stroke="#c0caf5" stroke-width="1.6" stroke-linecap="round" fill="none">
    <circle cx="924" cy="21" r="10" fill="#2f3549" stroke="none"/>
    <line x1="919" y1="21" x2="929" y2="21"/>
    <circle cx="950" cy="21" r="10" fill="#2f3549" stroke="none"/>
    <rect x="945.5" y="16.5" width="9" height="9" rx="1"/>
    <circle cx="976" cy="21" r="10" fill="#e95420" stroke="none"/>
    <line x1="972" y1="17" x2="980" y2="25" stroke="#ffffff"/><line x1="980" y1="17" x2="972" y2="25" stroke="#ffffff"/>
  </g>

  <clipPath id="l1"><rect x="36" y="66" height="30.0" width="0">
    <set attributeName="width" to="0" begin="cycle.begin"/>
    <animate attributeName="width" values="0.0;12.0;24.0;36.0;48.0;60.0;72.0;84.0;96.0;108.0;120.0;132.0;144.0;156.0;168.0;180.0;192.0;204.0;216.0;228.0;240.0;252.0" calcMode="discrete" dur="1.26s" begin="cycle.begin+0.4s" fill="freeze"/>
  </rect></clipPath>
  <text x="36" y="86" font-size="20" clip-path="url(#l1)"><tspan class="p">cr4ni0</tspan><tspan class="dim">:</tspan><tspan class="b">~</tspan><tspan class="c">$ whoami</tspan></text>
  <text x="36" y="134" font-size="40" opacity="0" font-weight="700"><tspan class="c">Cassiano Soares</tspan>
    <set attributeName="opacity" to="0" begin="cycle.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cycle.begin+2.0s" fill="freeze"/>
  </text>
  <text x="36" y="166" font-size="19" opacity="0"><tspan class="v">Desenvolvedor Full Stack</tspan><tspan class="dim">  ·  </tspan><tspan class="b">Infraestrutura</tspan><tspan class="dim">  ·  </tspan><tspan class="o">IA</tspan>
    <set attributeName="opacity" to="0" begin="cycle.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cycle.begin+2.3s" fill="freeze"/>
  </text>
  <clipPath id="l3"><rect x="36" y="194" height="30.0" width="0">
    <set attributeName="width" to="0" begin="cycle.begin"/>
    <animate attributeName="width" values="0.0;12.0;24.0;36.0;48.0;60.0;72.0;84.0;96.0;108.0;120.0;132.0;144.0;156.0;168.0;180.0;192.0;204.0;216.0;228.0;240.0;252.0;264.0;276.0;288.0;300.0;312.0;324.0;336.0;348.0" calcMode="discrete" dur="1.74s" begin="cycle.begin+3.3s" fill="freeze"/>
  </rect></clipPath>
  <text x="36" y="214" font-size="20" clip-path="url(#l3)"><tspan class="p">cr4ni0</tspan><tspan class="dim">:</tspan><tspan class="b">~</tspan><tspan class="c">$ cat stack.txt</tspan></text>
  <clipPath id="l4"><rect x="36" y="226" height="27.0" width="0">
    <set attributeName="width" to="0" begin="cycle.begin"/>
    <animate attributeName="width" values="0.0;10.8;21.6;32.4;43.2;54.0;64.8;75.6;86.4;97.2;108.0;118.8;129.6;140.4;151.2;162.0;172.8;183.6;194.4;205.2;216.0;226.8;237.6;248.4;259.2;270.0;280.8;291.6;302.4;313.2;324.0;334.8;345.6;356.4;367.2;378.0;388.8;399.6" calcMode="discrete" dur="2.22s" begin="cycle.begin+5.4s" fill="freeze"/>
  </rect></clipPath>
  <text x="36" y="244" font-size="18" clip-path="url(#l4)"><tspan class="c">python  django  laravel  react  linux</tspan></text>
  <text x="36" y="280" font-size="18" opacity="0"><tspan class="p">cr4ni0</tspan><tspan class="dim">:</tspan><tspan class="b">~</tspan><tspan class="c">$ </tspan>
    <set attributeName="opacity" to="0" begin="cycle.begin"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="cycle.begin+8.0s" fill="freeze"/>
  </text>

  <g opacity="0">
    <set attributeName="opacity" to="0" begin="cycle.begin"/>
    <set attributeName="opacity" to="1" begin="cycle.begin+8.0s"/>
    <rect x="146" y="265" width="11" height="20" fill="#c0caf5">
      <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
